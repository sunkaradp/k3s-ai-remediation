apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: remediator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sunkaradp/k3s-ai-remediation
    targetRevision: main
    path: deploy/remediator
  destination:
    server: https://kubernetes.default.svc
    namespace: remediation
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
